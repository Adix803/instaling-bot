name: Codzienna sesja Instaling

on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests

      - name: Przywróć cache trudnych słów
        uses: actions/cache@v4
        with:
          path: trudne.json
          key: trudne-${{ github.run_id }}
          restore-keys: |
            trudne-

      - name: Uruchom bota
        env:
          INSTALING_EMAIL: ${{ secrets.INSTALING_EMAIL }}
          INSTALING_PASSWORD: ${{ secrets.INSTALING_PASSWORD }}
        run: python bot.py

      - name: Zapisz cache trudnych słów
        uses: actions/cache@v4
        with:
          path: trudne.json
          key: trudne-${{ github.run_id }}
