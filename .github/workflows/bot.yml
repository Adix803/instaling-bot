name: Codzienna sesja Instaling

on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj zależności
        run: |
          python -m pip install --upgrade pip
          pip install instaling-client

      - name: Uruchom bota
        env:
          INSTALING_EMAIL: ${{ secrets.INSTALING_EMAIL }}
          INSTALING_PASSWORD: ${{ secrets.INSTALING_PASSWORD }}
        run: python bot.py
